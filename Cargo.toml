
[package]
edition = "2024"
name = "embassy-st7789v"
version = "0.6.1"
authors = ["Jorge Andre Castro <georgeandrec@gmail.com>"]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Async no_std driver for the ST7789V 240x320 TFT LCD over SPI, based on Embassy, with optional framebuffer support."
documentation = "https://docs.rs/embassy-st7789v"
readme = "README.md"
keywords = ["embassy", "st7789v", "tft", "lcd", "no-std"]
categories = ["embedded", "no-std", "hardware-support"]
license = "GPL-2.0-or-later"
repository = "https://github.com/jorgeandrecastro/embassy-st7789v"

[lib]
name = "embassy_st7789v"
path = "src/lib.rs"

[features]
default = ["time-upstream"]

# Official Embassy backend
time-upstream = ["dep:embassy-time"]

# RP2350 Hazard3 RISC-V backend
time-riscv = ["dep:embassy-time-riscv"]

[dependencies]
embedded-hal = { version = "1.0", default-features = false }
embedded-hal-async = { version = "1.0", default-features = false }

embassy-time = {
    version = "0.5",
    optional = true,
    default-features = false
}

embassy-time-riscv = {
    version = "0.1.2",
    optional = true,
    default-features = false
}

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
